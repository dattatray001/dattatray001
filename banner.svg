<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 280" width="830" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Tag Background Gradient -->
    <linearGradient id="tag-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="830" height="280" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="80" r="180" fill="url(#glow-cyan)" filter="url(#blur-filter)"/>
  <circle cx="700" cy="180" r="160" fill="url(#glow-purple)" filter="url(#blur-filter)"/>

  <!-- Grid Layout -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <!-- Horizontal Grid Lines -->
    <path d="M 0,40 L 830,40 M 0,80 L 830,80 M 0,120 L 830,120 M 0,160 L 830,160 M 0,200 L 830,200 M 0,240 L 830,240"/>
    <!-- Vertical Grid Lines -->
    <path d="M 60,0 L 60,280 M 120,0 L 120,280 M 180,0 L 180,280 M 240,0 L 240,280 M 300,0 L 300,280 M 360,0 L 360,280 M 420,0 L 420,280 M 480,0 L 480,280 M 540,0 L 540,280 M 600,0 L 600,280 M 660,0 L 660,280 M 720,0 L 720,280 M 780,0 L 780,280"/>
  </g>

  <!-- Faded Code Background Overlay (Right Aligned) -->
  <g opacity="0.15" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" fill="#94a3b8">
    <text x="480" y="50" fill="#a855f7">@RestController</text>
    <text x="480" y="70" fill="#a855f7">@RequestMapping<tspan fill="#38bdf8">("/api/v1/orders")</tspan></text>
    <text x="480" y="90"><tspan fill="#f43f5e">public class</tspan> <tspan fill="#eab308">OrderController</tspan> {</text>
    
    <text x="500" y="115" fill="#a855f7">@PostMapping</text>
    <text x="500" y="135"><tspan fill="#f43f5e">public</tspan> ResponseEntity&lt;Order&gt; create(@RequestBody OrderReq req) {</text>
    <text x="520" y="155"><tspan fill="#f43f5e">log</tspan>.info(<tspan fill="#38bdf8">"Creating order: {}"</tspan>, req.getId());</text>
    <text x="520" y="175"><tspan fill="#f43f5e">return</tspan> ResponseEntity.ok(orderService.process(req));</text>
    <text x="500" y="195">}</text>
    
    <text x="500" y="220" fill="#a855f7">@GetMapping<tspan fill="#38bdf8">("/{id}")</tspan></text>
    <text x="500" y="240"><tspan fill="#f43f5e">public</tspan> ResponseEntity&lt;Order&gt; getById(@PathVariable Long id) { ... }</text>
    <text x="480" y="260">}</text>
  </g>

  <!-- Floating Abstract Microservices Nodes on Top of Code (Glow effect) -->
  <g opacity="0.6">
    <!-- Links -->
    <line x1="720" y1="90" x2="670" y2="160" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2,3"/>
    <line x1="720" y1="90" x2="790" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="670" y1="160" x2="750" y2="210" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="790" y1="120" x2="750" y2="210" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <!-- Glowing Nodes -->
    <circle cx="720" cy="90" r="6" fill="#6366f1" filter="url(#glow-strong)"/>
    <circle cx="670" cy="160" r="5" fill="#a855f7"/>
    <circle cx="790" cy="120" r="7" fill="#38bdf8" filter="url(#glow-strong)"/>
    <circle cx="750" cy="210" r="8" fill="#ec4899"/>
    
    <!-- Microservice Labels -->
    <text x="730" y="94" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Gateway</text>
    <text x="615" y="164" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Auth Service</text>
    <text x="802" y="124" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Order API</text>
    <text x="762" y="214" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Database</text>
  </g>

  <!-- Left Content: Profile Info -->
  <g transform="translate(50, 0)">
    <!-- Role Tag -->
    <g transform="translate(0, 50)">
      <rect width="165" height="24" rx="12" fill="url(#tag-bg)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="12" r="4" fill="#38bdf8" filter="url(#glow-strong)"/>
      <text x="24" y="16" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="9.5" fill="#38bdf8" letter-spacing="1.5">BACKEND ENGINEER</text>
    </g>

    <!-- Main Title (Name) -->
    <text x="0" y="115" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="url(#title-grad)">
      Dattatray Narhe
    </text>

    <!-- Subtitle (Motto/Focus) -->
    <text x="0" y="155" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18.5" fill="#f8fafc">
      Designing Scalable &amp; Secure REST APIs
    </text>

    <!-- Description / Key Skills Row -->
    <text x="0" y="188" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="13" fill="#94a3b8" letter-spacing="0.5">
      Specializing in enterprise Java architectures, Spring Ecosystem,
    </text>
    <text x="0" y="208" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="13" fill="#94a3b8" letter-spacing="0.5">
      relational &amp; non-relational database tuning, and Docker environments.
    </text>

    <!-- Tech Stack Mini Badges (Visual inline vector graphics) -->
    <g transform="translate(0, 230)">
      <!-- Java Badge -->
      <g transform="translate(0,0)">
        <rect width="52" height="20" rx="4" fill="#1e293b"/>
        <text x="26" y="14" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#f8fafc" text-anchor="middle">Java</text>
      </g>
      <!-- Spring Badge -->
      <g transform="translate(58,0)">
        <rect width="82" height="20" rx="4" fill="#1e293b"/>
        <text x="41" y="14" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#4ade80" text-anchor="middle">Spring Boot</text>
      </g>
      <!-- Docker Badge -->
      <g transform="translate(146,0)">
        <rect width="62" height="20" rx="4" fill="#1e293b"/>
        <text x="31" y="14" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">Docker</text>
      </g>
      <!-- Microservices Badge -->
      <g transform="translate(214,0)">
        <rect width="96" height="20" rx="4" fill="#1e293b"/>
        <text x="48" y="14" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#c084fc" text-anchor="middle">Microservices</text>
      </g>
    </g>
  </g>
</svg>
